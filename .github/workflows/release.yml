name: Release

on:
  push:
    branches: [main]
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_INCREMENTAL: '0'

defaults:
  run:
    shell: bash

jobs:
  sources:
    # Default-branch builds warm caches that later release tags can restore.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: sources
        with:
          path: |
            .cargo-home/registry/cache
            .cargo-home/git/db
          key: cargo-sources-v1-${{ hashFiles('Cargo.lock') }}
          enableCrossOsArchive: true
      - if: steps.sources.outputs.cache-hit != 'true'
        run: cargo fetch --locked

  linux:
    needs: sources
    # Source cache warming is optional; its failure must not block builds.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    env:
      # Also applies to linuxdeploy's nested AppImage plugin; no FUSE mount.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake nasm pkg-config file desktop-file-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cargo-home/registry/cache
            .cargo-home/git/db
          key: cargo-sources-v1-${{ hashFiles('Cargo.lock') }}
          enableCrossOsArchive: true
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ubuntu-24.04-linux-${{ matrix.target }}
          cache-bin: false

      - name: Build and package distribution
        run: cargo xtask dist --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    # Build the MSVC ABI with LLVM and xwin's Windows SDK/CRT on Linux.
    needs: sources
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
          - target: i686-pc-windows-msvc
            arch: x86
          - target: aarch64-pc-windows-msvc
            arch: aarch64
    env:
      XWIN_ARCH: ${{ matrix.arch }}
      XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache
      XWIN_CROSS_COMPILER: clang-cl
    steps:
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake nasm pkg-config clang llvm lld ninja-build nsis
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cargo-home/registry/cache
            .cargo-home/git/db
          key: cargo-sources-v1-${{ hashFiles('Cargo.lock') }}
          enableCrossOsArchive: true
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ubuntu-24.04-windows-${{ matrix.target }}-xwin-0.23.1
          cache-bin: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: tools
        with:
          path: target/host-tools
          key: windows-tools-ubuntu-24.04-${{ runner.arch }}-xwin-0.23.1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: windows-sdk-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-xwin-0.23.1-v1
      - name: Install Cargo cross-compiler
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root target/host-tools cargo-xwin@0.23.1
      - name: Build and package distribution
        run: cargo xtask dist --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: sources
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake nasm pkg-config xz-utils libssl-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.17.0'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cargo-home/registry/cache
            .cargo-home/git/db
          key: cargo-sources-v1-${{ hashFiles('Cargo.lock') }}
          enableCrossOsArchive: true
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ubuntu-24.04-macos-zig-0.17.0-sdk-26.1
          cache-bin: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: tools
        with:
          path: target/host-tools
          key: macos-tools-ubuntu-24.04-${{ runner.arch }}-zigbuild-0.24.0-bundle-0.12.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/macos-sdk
          key: macos-sdk-${{ runner.os }}-26.1-beee7212
      - name: Install Cargo build tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --root target/host-tools cargo-zigbuild@0.24.0 cargo-bundle@0.12.0
      - name: Test disk image packaging
        run: cargo test --locked -p xtask
      - name: Build, bundle and verify universal macOS release
        run: cargo xtask dist --target universal2-apple-darwin

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos
          if-no-files-found: error
          path: |
            dist/jimpactor-macos-universal.dmg
            dist/jimpactor-macos-universal
            dist/jimpactor-cli-macos-universal
            dist/jimpactor-macos-universal.app.tar.gz
            dist/LICENSE
            dist/Attributions.md

  release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    # Publish successful matrix artifacts even when another build fails.
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [linux, windows, macos]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: dist-*
          path: upload
          merge-multiple: true

      - name: Check for successful distributions
        id: distributions
        run: |
          if compgen -G 'upload/jimpactor-*' > /dev/null; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No successful distributions; skipping release creation.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create Release
        if: steps.distributions.outputs.available == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
