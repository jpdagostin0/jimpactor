[package]
name = "xkit"
description = "Apple developer authentication, provisioning, signing, and installation."
edition.workspace = true
version.workspace = true
authors = ["Kabir Oberai"]
license.workspace = true
repository.workspace = true

[dependencies]
plume_core = { path = "../core", features = ["tweaks"] }
idevice.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time", "macros"] }
futures.workspace = true
plist.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
chrono.workspace = true
zip.workspace = true
log.workspace = true
apple-codesign = { version = "0.29.0", default-features = false }
apple-bundles = "0.21"
x509-certificate = "0.24"
rsa = "0.9"
rcgen = "0.12"
pem = "3.0"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }
