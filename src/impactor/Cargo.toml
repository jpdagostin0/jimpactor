[package]
name = "jimpactor"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.bundle]
name = "Jimpactor"
identifier = "io.github.jpdagostin0.jimpactor"
icon = ["package/icon.svg"]
category = "Utility"
short_description = "Sign, sideload, and refresh iOS apps"
copyright = "Copyright © 2026 JP D'Agostino"

[package.metadata.bundle.osx]
minimum_system_version = "11.0"
info_plist_exts = ["package/macos/Info.plist.ext"]

[dependencies]
idevice.workspace = true
tokio.workspace = true
thiserror.workspace = true
uuid.workspace = true
plist.workspace = true
futures.workspace = true
env_logger.workspace = true
log.workspace = true
chrono.workspace = true
rustls.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
tiny-skia = "0.11.4"
tray = "0.1.2"
plume_core = { path = "../../crates/core", features = ["tweaks"] }
plume_utils = { path = "../../crates/utils" }
plume_store = { path = "../../crates/store" }

iced = { version = "0.14", features = ["image-without-codecs", "advanced"] }
wgpu = { version = "27.0", default-features = false, features = ["std"] }     # Power references
rfd = "0.16"                                                                  # File dialogs
open = "5.3"                                                                  # Opening links (I know, useless)
notify-rust = "4.11"                                                          # Notifications
single-instance = "0.3"                                                       # Ensuring single instance of the app on Linux and Windows
auto-launcher = "0.6"                                                         # Auto-launching on startup
rust-i18n = "4.0"
current_locale = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
plume_gestalt = { path = "../../crates/gestalt" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[build-dependencies]
winresource = "0.1"
genicons = { path = "../../tools/genicons" }
